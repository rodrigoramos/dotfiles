# Links comuns a Linux e macOS.
# O script ./install aplica este arquivo + install.<linux|macos>.yaml.
- defaults:
    link:
      relink: true

- link:
    ~/.dotfiles: ''
    ~/.vimrc: vimrc
    ~/.ideavimrc: ideavimrc
    ~/.gitconfig:
        path: gitconfig
        force: true
    ~/.config/nvim:
        path: 'nvim/config'
        create: true
        glob: true
    ~/.local/share/nvim/site/autoload/plug.vim:
        path: nvim/autoload/plug.vim
        create: true
    ~/.config/kitty:
        path: kitty
        create: true
        force: true
    ~/.config/fish:
        path: fish
        create: true
        force: true
    ~/.local/bin/pgc:
        path: bin/pgc
        create: true
    # Claude Code: só a parte pública (settings.json e o que é interno ficam fora)
    ~/.claude/CLAUDE.md:
        path: claude/CLAUDE.md
        create: true
    ~/.claude/skills/:
        path: 'claude/skills/*'
        create: true
        glob: true

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - command: >-
        command -v fish >/dev/null || exit 0;
        fish -c 'type -q fisher; or curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source; and fisher update'
      description: Installing fish plugins (fisher)
      stdout: true
    # A pasta de memória do Claude leva o $HOME no nome (/home/a.b -> -home-a-b)
    - command: >-
        mem="$HOME/.claude/projects/$(printf %s "$HOME" | sed 's/[^A-Za-z0-9]/-/g')/memory";
        mkdir -p "$mem";
        for f in "$PWD"/claude/memory/*.md; do ln -sfn "$f" "$mem/"; done
      description: Linking Claude memories
