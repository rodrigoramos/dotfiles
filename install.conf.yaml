# Links comuns a Linux e macOS.
# O script ./install aplica este arquivo + install.<linux|macos>.yaml.
- defaults:
    link:
      relink: true

- link:
    ~/.dotfiles: ''
    ~/.vimrc: vimrc
    ~/.ideavimrc: ideavimrc
    ~/.gitconfig:
        path: gitconfig
        force: true
    ~/.config/nvim:
        path: 'nvim/config'
        create: true
        glob: true
    ~/.local/share/nvim/site/autoload/plug.vim:
        path: nvim/autoload/plug.vim
        create: true
    ~/.config/kitty:
        path: kitty
        create: true
        force: true
    ~/.config/fish:
        path: fish
        create: true
        force: true

- shell:
    - [git submodule update --init --recursive, Installing submodules]
