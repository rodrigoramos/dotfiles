# Links só do macOS.
- defaults:
    link:
      relink: true

- link:
    ~/.config/rift/config.toml:
        path: macos/rift/config.toml
        create: true
    ~/.config/sketchybar:
        path: macos/sketchybar
        create: true
    # Diretório inteiro: o Karabiner regrava o karabiner.json e quebraria um link só do arquivo.
    ~/.config/karabiner:
        path: macos/karabiner
        create: true

- shell:
    - command: 'if command -v brew >/dev/null; then brew bundle --file=macos/Brewfile; else echo "Homebrew não encontrado: instale em https://brew.sh e rode ./install de novo"; fi'
      description: Installing Homebrew packages (macos/Brewfile)
      stdout: true
      stderr: true
    # LaunchAgent do brew services: sobe no login e o launchd reinicia se cair.
    - command: 'if command -v brew >/dev/null && brew list sketchybar >/dev/null 2>&1; then brew services start sketchybar; fi'
      description: Starting SketchyBar (brew services)
      stdout: true
      stderr: true
