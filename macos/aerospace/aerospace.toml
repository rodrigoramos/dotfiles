# AeroSpace — espelha os atalhos do Hyprland (ver keymap.md).
# No Hyprland o modificador é Super; aqui é Alt (Option), porque Cmd já é usado pelos apps do macOS.
# Atenção: alt-e, alt-i, alt-n, alt-u e alt-` são teclas mortas de acento no layout US do macOS;
# evite vinculá-las.

start-at-login = true
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse segue o foco ao trocar de monitor
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# Apps
alt-enter = 'exec-and-forget open -n -a kitty'

# Janela
alt-q = 'close'
alt-shift-f = 'fullscreen'
alt-space = 'layout floating tiling'
alt-shift-i = 'layout horizontal vertical'   # equivale ao togglesplit

# Foco (Super+setas no Hyprland)
alt-left = 'focus left'
alt-right = 'focus right'
alt-up = 'focus up'
alt-down = 'focus down'

# Mover janela (Super+Ctrl+setas)
alt-ctrl-left = 'move left'
alt-ctrl-right = 'move right'
alt-ctrl-up = 'move up'
alt-ctrl-down = 'move down'

# Redimensionar (Super+Shift+setas)
alt-shift-left = 'resize width -50'
alt-shift-right = 'resize width +50'
alt-shift-up = 'resize height -50'
alt-shift-down = 'resize height +50'

# Workspaces (Super+1..0)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'
alt-tab = 'workspace --wrap-around next'
alt-shift-tab = 'workspace --wrap-around prev'

# Mover janela para workspace e seguir (Super+Shift+N)
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
alt-shift-0 = 'move-node-to-workspace --focus-follows-window 10'

# Mover janela sem seguir (Super+Ctrl+N)
alt-ctrl-1 = 'move-node-to-workspace 1'
alt-ctrl-2 = 'move-node-to-workspace 2'
alt-ctrl-3 = 'move-node-to-workspace 3'
alt-ctrl-4 = 'move-node-to-workspace 4'
alt-ctrl-5 = 'move-node-to-workspace 5'
alt-ctrl-6 = 'move-node-to-workspace 6'
alt-ctrl-7 = 'move-node-to-workspace 7'
alt-ctrl-8 = 'move-node-to-workspace 8'
alt-ctrl-9 = 'move-node-to-workspace 9'
alt-ctrl-0 = 'move-node-to-workspace 10'

# Recarregar config
alt-shift-r = 'reload-config'
