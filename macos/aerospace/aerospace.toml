# AeroSpace — espelha os atalhos do Hyprland (ver keymap.md).
# No Hyprland o modificador é Super; aqui é Alt (Option), porque Cmd já é usado pelos apps do macOS.
# Atenção: alt-e, alt-i, alt-n, alt-u e alt-` são teclas mortas de acento no layout US do macOS;
# evite vinculá-las.

start-at-login = false
# Borda na janela focada (JankyBorders, instalado pelo macos/Brewfile).
# Caminho absoluto: no login o PATH herdado pelo AeroSpace não inclui o Homebrew.
after-startup-command = [
  'exec-and-forget /opt/homebrew/bin/borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse segue o foco ao trocar de monitor
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Rill (precisa ficar no nível raiz, antes de qualquer [tabela])
exec-on-workspace-change = ['/opt/homebrew/bin/rillctl', 'emit', '--source', 'aerospace', '--name', 'refresh', '--data', '{}']
on-mode-changed = ['exec-and-forget /bin/bash -c "$HOME/.config/aegis/aegis-aerospace-mode-notify"']

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
# Monitor externo (LU28R55, o "HDMI-1" do Linux): mais espaço no topo para a barra do Rill.
outer.top = [{ monitor."LU28R55" = 40 }, 8]
outer.right = 8

[mode.main.binding]
# Apps
alt-enter = 'exec-and-forget open -n -a kitty'

# Janela
alt-q = 'close'
alt-shift-f = 'fullscreen'
alt-space = 'layout floating tiling'
alt-shift-i = 'layout horizontal vertical'   # equivale ao togglesplit

# Foco (Super+setas no Hyprland)
alt-left = 'focus left'
alt-right = 'focus right'
alt-up = 'focus up'
alt-down = 'focus down'

# Mover janela (Super+Ctrl+setas)
alt-ctrl-left = 'move left'
alt-ctrl-right = 'move right'
alt-ctrl-up = 'move up'
alt-ctrl-down = 'move down'

# Redimensionar (Super+Shift+setas)
alt-shift-left = 'resize width -50'
alt-shift-right = 'resize width +50'
alt-shift-up = 'resize height -50'
alt-shift-down = 'resize height +50'

# Workspaces (Super+1..0)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'
alt-tab = 'workspace --wrap-around next'
alt-shift-tab = 'workspace --wrap-around prev'

# Mover janela para workspace e seguir (Super+Shift+N)
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
alt-shift-0 = 'move-node-to-workspace --focus-follows-window 10'

# Mover janela sem seguir (Super+Ctrl+N)
alt-ctrl-1 = 'move-node-to-workspace 1'
alt-ctrl-2 = 'move-node-to-workspace 2'
alt-ctrl-3 = 'move-node-to-workspace 3'
alt-ctrl-4 = 'move-node-to-workspace 4'
alt-ctrl-5 = 'move-node-to-workspace 5'
alt-ctrl-6 = 'move-node-to-workspace 6'
alt-ctrl-7 = 'move-node-to-workspace 7'
alt-ctrl-8 = 'move-node-to-workspace 8'
alt-ctrl-9 = 'move-node-to-workspace 9'
alt-ctrl-0 = 'move-node-to-workspace 10'

# Recarregar config
alt-shift-r = 'reload-config'

# Voltar ao workspace anterior (i3: $mod+b)
alt-b = 'workspace-back-and-forth'

# Mover janela estilo vim (i3: $mod+Shift+j/k/l/ç)
alt-shift-j = 'move left'
alt-shift-k = 'move down'
alt-shift-l = 'move up'
alt-shift-semicolon = 'move right'

# Modo resize (i3: $mod+r)
alt-r = 'mode resize'

# Modo para mover o workspace atual entre monitores (i3: $mod+Shift+m)
alt-shift-m = 'mode move-workspace'

[mode.move-workspace.binding]
h = ['move-workspace-to-monitor --wrap-around left', 'mode main']
j = ['move-workspace-to-monitor --wrap-around down', 'mode main']
k = ['move-workspace-to-monitor --wrap-around up', 'mode main']
l = ['move-workspace-to-monitor --wrap-around right', 'mode main']
n = ['move-workspace-to-monitor "Built-in Retina Display"', 'mode main']
enter = 'mode main'
esc = 'mode main'

# Modo resize (i3: mode "resize"; o ç do i3 vira semicolon no layout US)
[mode.resize.binding]
j = 'resize width -10'
k = 'resize height +10'
l = 'resize height -10'
semicolon = 'resize width +10'
left = 'resize width -10'
down = 'resize height +10'
up = 'resize height -10'
right = 'resize width +10'
enter = 'mode main'
esc = 'mode main'
alt-r = 'mode main'

# Workspaces fixos por monitor (i3: `workspace "N" output ...`).
# Aqui "secondary" é o monitor externo e "built-in" é a tela do MacBook.
[workspace-to-monitor-force-assignment]
1 = 'built-in'
3 = ['secondary', 'built-in']
4 = ['secondary', 'built-in']
6 = ['secondary', 'built-in']

# Regras por aplicativo (i3: assign / for_window).
# Só a primeira regra que casa é executada, então as mais específicas vêm antes.
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
if.window-title-regex-substring = 'Círculo|canal desconhecido'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'org.keepassxc.keepassxc'
run = 'layout floating'

# Apps ainda não instalados: os bundle IDs abaixo são os usuais e não foram confirmados.
[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92' # Cursor
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.electron.logseq'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 9'
